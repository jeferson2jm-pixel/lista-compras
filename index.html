<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Compras — Valores na Lista 🛍️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2f855a 0%, #2b6cb0 100%);
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #2d3748;
            margin-bottom: 20px;
            font-size: 1.6rem;
        }

        .caixa-total {
            background: linear-gradient(135deg, #f6e05e 0%, #ed8936 100%);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            text-align: center;
        }

        .texto-total {
            font-size: 1rem;
            color: #744210;
            font-weight: 600;
        }

        .valor-total {
            font-size: 2.2rem;
            font-weight: 800;
            color: #744210;
            margin-top: 5px;
        }

        .sub-totais {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 10px;
            font-size: 0.9rem;
            color: #744210;
        }

        .form-adicionar {
            background: #f7fafc;
            padding: 18px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .form-adicionar h3 {
            margin-bottom: 12px;
            color: #2d3748;
            font-size: 1rem;
        }

        .linha-form {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .linha-form input, .linha-form select {
            padding: 10px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.95rem;
        }

        .linha-form input:nth-child(1) { flex: 2; min-width: 140px; }
        .linha-form input:nth-child(2) { width: 70px; }
        .linha-form input:nth-child(3) { width: 110px; }
        .linha-form select { width: 130px; }

        button {
            padding: 10px 16px;
            background: #2f855a;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        button:hover { transform: scale(1.05); }

        .btn-excluir {
            background: #e53e3e;
            padding: 6px 10px;
            font-size: 0.8rem;
        }

        .categoria {
            margin: 25px 0 12px;
            padding-bottom: 8px;
            font-size: 1.05rem;
            font-weight: 700;
            border-bottom: 2px solid;
        }
        .acougue { color: #c53030; border-color: #feb2b2; }
        .alimentos { color: #2b6cb0; border-color: #bee3f8; }
        .higiene { color: #2f855a; border-color: #c6f6d5; }
        .varejao { color: #d69e2e; border-color: #fef3c7; }
        .doces { color: #d53f8c; border-color: #fbb6ce; }

        ul { list-style: none; }

        li {
            padding: 12px 15px;
            background: #f7fafc;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            transition: all 0.3s ease;
        }

        li:hover { background: #edf2f7; }
        li.comprado {
            background: #f0fff4;
            opacity: 0.7;
        }
        li.comprado .nome-item { text-decoration: line-through; color: #2f855a; }

        .nome-item {
            font-weight: 600;
            flex: 1;
            min-width: 140px;
            cursor: pointer;
        }

        .campo-qtd, .campo-valor {
            width: 70px;
            padding: 6px 8px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            text-align: center;
            font-size: 0.9rem;
        }

        .subtotal-item {
            font-weight: 700;
            color: #2f855a;
            min-width: 90px;
            text-align: right;
        }

        .vazio {
            text-align: center;
            color: #a0aec0;
            padding: 15px;
            font-style: italic;
        }

        .titulo-comprados {
            margin-top: 35px;
            padding-top: 20px;
            border-top: 2px dashed #e2e8f0;
            color: #48bb78;
            font-size: 1.2rem;
        }

        .botoes {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-vermelho { background: #e53e3e; }
        .btn-vermelho:hover { background: #c53030; }
        .btn-cinza { background: #718096; }
        .btn-cinza:hover { background: #4a5568; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒 Lista de Compras — Cálculo Automático</h1>

        <!-- CAIXA COM OS TOTAIS -->
        <div class="caixa-total">
            <div class="texto-total">VALOR TOTAL DA COMPRA</div>
            <div class="valor-total" id="mostraTotal">R$ 0,00</div>
            <div class="sub-totais">
                <div>Para comprar: <span id="mostraParaComprar">R$ 0,00</span></div>
                <div>Já comprado: <span id="mostraComprado">R$ 0,00</span></div>
            </div>
        </div>

        <!-- ADICIONAR NOVO ITEM -->
        <div class="form-adicionar">
            <h3>➕ Adicionar Novo Item</h3>
            <div class="linha-form">
                <input type="text" id="nomeNovo" placeholder="Nome do produto">
                <input type="number" id="qtdNovo" placeholder="Qtd" min="1" value="1">
                <input type="number" id="valorNovo" placeholder="R$ unit" step="0.01" min="0">
                <select id="categoriaNovo">
                    <option value="acougue">Açougue</option>
                    <option value="alimentos" selected>Alimentos</option>
                    <option value="higiene">Higiene</option>
                    <option value="varejao">Varejão</option>
                    <option value="doces">Doces/Lanche</option>
                </select>
                <button onclick="adicionarItem()">Adicionar</button>
            </div>
        </div>

        <!-- LISTA DE ITENS -->
        <div id="areaLista">
            <h3 class="categoria acougue">🥩 Açougue</h3>
            <ul id="acougue"></ul>

            <h3 class="categoria alimentos">🍚 Alimentos</h3>
            <ul id="alimentos"></ul>

            <h3 class="categoria higiene">🧼 Higiene e Limpeza</h3>
            <ul id="higiene"></ul>

            <h3 class="categoria varejao">🥬 Varejão</h3>
            <ul id="varejao"></ul>

            <h3 class="categoria doces">🍬 Doces e Lanches</h3>
            <ul id="doces"></ul>

            <h3 class="categoria titulo-comprados">✅ Itens Comprados</h3>
            <ul id="comprados"></ul>
        </div>

        <div class="botoes">
            <button class="btn-vermelho" onclick="limparComprados()">Limpar Comprados</button>
            <button class="btn-cinza" onclick="restaurarLista()">Restaurar Original</button>
            <button class="btn-vermelho" onclick="apagarTudo()">Apagar Tudo</button>
        </div>
    </div>

    <script>
        // LISTA PADRÃO COM QUANTIDADES JÁ PREENCHIDAS
        const listaPadrao = {
            acougue: [
                {nome: "Peito de frango", qtd: 1, valor: 0},
                {nome: "Sasami", qtd: 1, valor: 0},
                {nome: "Coxa sobre-coxa", qtd: 1, valor: 0},
                {nome: "Steik", qtd: 1, valor: 0},
                {nome: "Hamburguer", qtd: 1, valor: 0},
                {nome: "Linguiça calb", qtd: 1, valor: 0},
                {nome: "Linguiça", qtd: 1, valor: 0},
                {nome: "Bacon", qtd: 1, valor: 0},
                {nome: "Carne moída", qtd: 1, valor: 0},
                {nome: "Costela", qtd: 1, valor: 0},
                {nome: "Coxão mole bife", qtd: 1, valor: 0},
                {nome: "Bisteca ou lombo", qtd: 1, valor: 0},
                {nome: "Ponta de peito", qtd: 1, valor: 0},
                {nome: "Torresmo", qtd: 1, valor: 0}
            ],
            alimentos: [
                {nome: "Arroz", qtd: 2, valor: 0},
                {nome: "Feijão", qtd: 1, valor: 0},
                {nome: "Óleo", qtd: 8, valor: 0},
                {nome: "Sal", qtd: 1, valor: 0},
                {nome: "Açúcar", qtd: 2, valor: 0},
                {nome: "Macarrão", qtd: 3, valor: 0},
                {nome: "Farinha de trigo", qtd: 3, valor: 0},
                {nome: "Farinha temp", qtd: 2, valor: 0},
                {nome: "Milho de pipoca", qtd: 2, valor: 0},
                {nome: "Suco", qtd: 12, valor: 0},
                {nome: "Café", qtd: 1, valor: 0},
                {nome: "Nescau", qtd: 1, valor: 0},
                {nome: "Kit feijoada", qtd: 1, valor: 0},
                {nome: "Chá", qtd: 3, valor: 0},
                {nome: "Sardinha", qtd: 3, valor: 0},
                {nome: "Creme de leite", qtd: 3, valor: 0},
                {nome: "Leite condensado", qtd: 3, valor: 0},
                {nome: "Peixe", qtd: 1, valor: 0},
                {nome: "Azeitona", qtd: 1, valor: 0},
                {nome: "Salsicha", qtd: 1, valor: 0},
                {nome: "Tapioca", qtd: 3, valor: 0},
                {nome: "Ketchup", qtd: 1, valor: 0},
                {nome: "Mostarda", qtd: 1, valor: 0},
                {nome: "Shoyu", qtd: 1, valor: 0},
                {nome: "Maionese", qtd: 1, valor: 0},
                {nome: "Sazon", qtd: 3, valor: 0},
                {nome: "Fermento pó", qtd: 1, valor: 0},
                {nome: "Massa de bolo", qtd: 3, valor: 0}
            ],
            higiene: [
                {nome: "Sabonete", qtd: 6, valor: 0},
                {nome: "Pasta de dente", qtd: 3, valor: 0},
                {nome: "Shampoo", qtd: 1, valor: 0},
                {nome: "Condicionador", qtd: 1, valor: 0},
                {nome: "Creme de pele", qtd: 3, valor: 0},
                {nome: "Desodorante", qtd: 4, valor: 0},
                {nome: "Papel higiene", qtd: 12, valor: 0},
                {nome: "Amaciante", qtd: 1, valor: 0},
                {nome: "Sabão em pó", qtd: 1, valor: 0},
                {nome: "Sabão de barra", qtd: 2, valor: 0},
                {nome: "Brilha alumínio", qtd: 2, valor: 0},
                {nome: "Bombril", qtd: 2, valor: 0},
                {nome: "Desinfetante", qtd: 1, valor: 0}
            ],
            varejao: [
                {nome: "Tomate", qtd: 1, valor: 0},
                {nome: "Cebola", qtd: 1, valor: 0},
                {nome: "Alho", qtd: 1, valor: 0},
                {nome: "Batata", qtd: 1, valor: 0},
                {nome: "Cenoura", qtd: 1, valor: 0},
                {nome: "Batata palito", qtd: 1, valor: 0},
                {nome: "Batata doce", qtd: 1, valor: 0},
                {nome: "Ovo", qtd: 1, valor: 0},
                {nome: "Milho", qtd: 3, valor: 0},
                {nome: "Morango", qtd: 1, valor: 0},
                {nome: "Limão", qtd: 1, valor: 0},
                {nome: "Manteiga", qtd: 1, valor: 0},
                {nome: "Mussarela", qtd: 1, valor: 0},
                {nome: "Molho de tomate", qtd: 3, valor: 0}
            ],
            doces: [
                {nome: "Bolacha", qtd: 1, valor: 0},
                {nome: "Leite", qtd: 1, valor: 0},
                {nome: "Marmelo", qtd: 1, valor: 0},
                {nome: "Pão de lanche", qtd: 1, valor: 0},
                {nome: "Bisnaguinha", qtd: 1, valor: 0},
                {nome: "Bala de goma", qtd: 1, valor: 0},
                {nome: "Salgadinho diversos", qtd: 1, valor: 0}
            ]
        };

        let listaAtual = JSON.parse(localStorage.getItem('listaAtual')) || JSON.parse(JSON.stringify(listaPadrao));
        let comprados = JSON.parse(localStorage.getItem('comprados')) || [];

        function salvar() {
            localStorage.setItem('listaAtual', JSON.stringify(listaAtual));
            localStorage.setItem('comprados', JSON.stringify(comprados));
        }

        function formatarDinheiro(valor) {
            return 'R$ ' + valor.toFixed(2).replace('.', ',');
        }

        function calcularTotais() {
            let totalParaComprar = 0;
            let totalJaComprado = 0;

            for (const cat in listaAtual) {
                listaAtual[cat].forEach(item => {
                    totalParaComprar += item.qtd * item.valor;
                });
            }

            comprados.forEach(item => {
                totalJaComprado += item.qtd * item.valor;
            });

            const totalGeral = totalParaComprar + totalJaComprado;

            document.getElementById('mostraTotal').textContent = formatarDinheiro(totalGeral);
            document.getElementById('mostraParaComprar').textContent = formatarDinheiro(totalParaComprar);
            document.getElementById('mostraComprado').textContent = formatarDinheiro(totalJaComprado);
        }

        function renderizar() {
            for (const cat in listaPadrao) {
                const ul = document.getElementById(cat);
                ul.innerHTML = '';
                const itens = listaAtual[cat] || [];

                if (itens.length === 0) {
                    ul.innerHTML = '<li class="vazio">Todos comprados ✅</li>';
                } else {
                    itens.forEach((item, indice) => {
                        const li = document.createElement('li');
                        const subtotal = item.qtd * item.valor;
                        li.innerHTML = `
                            <span class="nome-item" onclick="marcarComprado('${cat}', ${indice})">${item.nome}</span>
                            <input type="number" class="campo-qtd" value="${item.qtd}" min="1"
                                onchange="atualizarValor('${cat}', ${indice}, 'qtd', this.value)">
                            <input type="number" class="campo-valor" value="${item.valor || ''}" step="0.01" min="0"
                                placeholder="R$"
                                onchange="atualizarValor('${cat}', ${indice}, 'valor', this.value)">
                            <span class="subtotal-item">= ${formatarDinheiro(subtotal)}</span>
                            <button class="btn-excluir" onclick="excluirItem('${cat}', ${indice})">✕</button>
                        `;
                        ul.appendChild(li);
                    });
                }
            }

            const ulComprados = document.getElementById('comprados');
            ulComprados.innerHTML = '';
            if (comprados.length === 0) {
                ulComprados.innerHTML = '<li class="vazio">Nenhum item comprado ainda</li>';
            } else {
                comprados.forEach((item, indice) => {
                    const li = document.createElement('li');
                    li.className = 'comprado';
                    const subtotal = item.qtd * item.valor;
                    li.innerHTML = `
                        <span class="nome-item" onclick="desfazerCompra(${indice})">${item.nome}</span>
                        <span>Qtd: ${item.qtd}</span>
                        <span>Unit: ${formatarDinheiro(item.valor)}</span>
                        <span class="subtotal-item">= ${formatarDinheiro(subtotal)}</span>
                        <button class="btn-excluir" onclick="excluirComprado(${indice})">✕</button>
                    `;
                    ulComprados.appendChild(li);
                });
            }

            calcularTotais();
        }

        function atualizarValor(categoria, indice, campo, valorNovo) {
            valorNovo = parseFloat(valorNovo) || (campo === 'qtd' ? 1 : 0);
            listaAtual[categoria][indice][campo] = valorNovo;
            salvar();
            renderizar();
        }

        function marcarComprado(categoria, indice) {
            const item = listaAtual[categoria].splice(indice, 1)[0];
            comprados.unshift({...item, categoria});
            salvar();
            renderizar();
        }

        function desfazerCompra(indice) {
            const item = comprados.splice(indice, 1)[0];
            const cat = item.categoria;
            if (listaAtual[cat]) {
                listaAtual[cat].unshift(item);
            } else {
                listaAtual.doces.unshift(item);
            }
            salvar();
            renderizar();
        }

        function excluirItem(categoria, indice) {
            if (confirm('Excluir este item?')) {
                listaAtual[categoria].splice(indice, 1);
                salvar();
                renderizar();
            }
        }

        function excluirComprado(indice) {
            if (confirm('Excluir permanentemente?')) {
                comprados.splice(indice, 1);
                salvar();
                renderizar();
            }
        }

        function adicionarItem() {
            const nome = document.getElementById('nomeNovo').value.trim();
            const qtd = parseInt(document.getElementById('qtdNovo').value) || 1;
            const valor = parseFloat(document.getElementById('valorNovo').value) || 0;
            const cat = document.getElementById('categoriaNovo').value;

            if (!nome) {
                alert('Digite o nome do produto!');
                return;
            }

            listaAtual[cat].unshift({nome, qtd, valor});
            
            document.getElementById('nomeNovo').value = '';
            document.getElementById('qtdNovo').value = '1';
            document.getElementById('valorNovo').value = '';
            
            salvar();
            renderizar();
        }

        function limparComprados() {
            if (comprados.length > 0 && confirm('Remover todos os comprados?')) {
                comprados = [];
                salvar();
                renderizar();
            }
        }

        function restaurarLista() {
            if (confirm('Voltar lista original? Itens novos serão perdidos!')) {
                localStorage.clear();
                listaAtual = JSON.parse(JSON.stringify(listaPadrao));
                comprados = [];
                salvar();
                renderizar();
            }
        }

        function apagarTudo() {
            if (confirm('Tem certeza? Tudo será apagado!')) {
                localStorage.clear();
                listaAtual = JSON.parse(JSON.stringify(listaPadrao));
                comprados = [];
                salvar();
                renderizar();
            }
        }

        // Adicionar com Enter
        document.getElementById('nomeNovo').addEventListener('keypress', e => {
            if (e.key === 'Enter') adicionarItem();
        });
        document.getElementById('valorNovo').addEventListener('keypress', e => {
            if (e.key === 'Enter') adicionarItem();
        });

        renderizar();
    </script>
</body>
</html>
